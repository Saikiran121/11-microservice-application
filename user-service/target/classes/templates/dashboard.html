<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - User Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <div class="nav-content">
            <h3>E-Commerce Platform</h3>
            <div class="nav-right">
                <span sec:authentication="name">User</span>
                <a href="/profile" class="btn btn-small">Profile</a>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-small btn-danger">Logout</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard-content">
            <h1>Welcome to Dashboard</h1>
            <p>You are logged in as: <strong sec:authentication="name">User</strong></p>
            
            <div class="card-grid">
                <div class="card">
                    <h3>Profile</h3>
                    <p>Manage your account settings</p>
                    <a href="/profile" class="btn btn-primary">View Profile</a>
                </div>
                
                <div class="card">
                    <h3>Orders</h3>
                    <p>View your order history</p>
                    <button class="btn btn-secondary">Coming Soon</button>
                </div>
                
                <div class="card">
                    <h3>Products</h3>
                    <p>Browse available products</p>
                    <button class="btn btn-secondary">Coming Soon</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
