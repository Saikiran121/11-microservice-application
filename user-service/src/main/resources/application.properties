# Server Configuration
server.port=8081
spring.application.name=user-service

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/userservice_db
spring.datasource.username=ecommuser
spring.datasource.password=ecomm123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBe256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.ecomm.userservice=DEBUG
